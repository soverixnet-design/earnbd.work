<script>
const $=s=>document.querySelector(s),fm=n=>Math.round(n).toLocaleString();
let lp=0;const lh=setInterval(()=>{lp++;if(lp>=10){clearInterval(lh);$('#load').remove()}},1000);
const K=['7','B3','B2','B1','BL','GR','OR','CH'],W={'7':2,'B3':3,'B2':4,'B1':6,'BL':10,'GR':22,'OR':34,'CH':50},P3={'7':70,'B3':20,'B2':15,'B1':12,'BL':10,'GR':7,'OR':6,'CH':5},P2={'7':6,'B3':5,'B2':4,'B1':3.5,'BL':3,'GR':3,'OR':3,'CH':2.5},MIX=4.5,TW=K.reduce((a,k)=>a+W[k],0),BARS=['B3','B2','B1'];
const TX={'7':'7️⃣','B3':'BAR³','B2':'BAR²','B1':'BAR','BL':'🔔','GR':'🍇','OR':'🍊','CH':'🍒'};
function sym(k,fs){const s=fs?` style="--fs:${fs}px"`:'';if(k=='7')return`<span class="sy"${s}><b class="s7">7</b></span>`;if(k[0]=='B')return`<span class="sy"${s}><span class="bar b${k[1]}">${'<i>BAR</i>'.repeat(+k[1])}</span></span>`;return`<span class="sy"${s}><span class="e">${TX[k]}</span></span>`}
function ev(r){if(r[0]==r[1]&&r[1]==r[2])return{m:P3[r[0]],n:3};if(r.every(k=>BARS.includes(k)))return{m:MIX,n:3};if(r[0]==r[1])return{m:P2[r[0]],n:2};return{m:0,n:0}}
function pick(){let x=Math.random()*TW;for(const k of K){if((x-=W[k])<0)return k}return'CH'}
let bal=1000000,bi=2,today=0,fast=0,auto=0,busy=0,mus=1,snd=1,ac,H=[],best=0;const BETS=[100,500,1000,5000,10000,50000,100000];
try{bal=+localStorage.getItem('sl_b')||1000000;H=JSON.parse(localStorage.getItem('sl_h')||'[]');best=+localStorage.getItem('sl_w')||0}catch(e){}
$('#pt').innerHTML=[['7','7','7',70],['B3','B3','B3',20],['B2','B2','B2',15],['B1','B1','B1',12],['BL','BL','BL',10],['GR','GR','GR',7],['OR','OR','OR',6],['CH','CH','CH',5],['B3','B2','B1',4.5]].map(r=>`<div><span>${r.slice(0,3).map(k=>sym(k)).join('')}</span><span>x${r[3]}</span></div>`).join('');
const cols=[...document.querySelectorAll('.rl')];let cur=[['CH','7','BL'],['OR','CH','GR'],['B1','B2','CH']];
function show(c,a,t){const st=document.createElement('div');st.className='st';st.innerHTML=a.map(k=>`<div class="ce">${sym(k)}</div>`).join('');c.innerHTML='';c.appendChild(st)}
cols.forEach((c,i)=>show(c,cur[i]));
function beep(f,d,v){if(!snd)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=v||.07;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
setInterval(()=>{if(mus&&ac){const n=[523,587,659,784,880][Math.random()*5|0];const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=n;g.gain.value=.025;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.4)}},1300);
function ui(){$('#bl').textContent=fm(bal);$('#tw').textContent=fm(today);$('#bv').textContent=fm(BETS[bi]);try{localStorage.setItem('sl_b',bal)}catch(e){}try{parent.postMessage({type:'wallet',balance:bal},'*')}catch(e){}}
function mg(s){$('#mg').textContent=s;clearTimeout(mg.h);mg.h=setTimeout(()=>$('#mg').textContent='',2500)}
function spin(){if(busy)return;const bet=BETS[bi];if(bal<bet){mg('কয়েন যথেষ্ট নয়');auto=0;$('#sp').classList.remove('auto');return}busy=1;bal-=bet;ui();beep(400,.1);
const res=[pick(),pick(),pick()],H3=72;let done=0;cols.forEach((c,i)=>{c.querySelectorAll('.hit').forEach(x=>x.classList.remove('hit'));const n=fast?12:22+i*6,arr=[];for(let j=0;j<n;j++)arr.push(pick());arr.push(pick(),res[i],pick());const old=cur[i];arr.unshift(...old);show(c,arr);const st=c.firstChild,dist=(arr.length-3)*H3,d=(fast?500:1300)+i*(fast?150:420);
st.style.transform='translateY(0)';st.getBoundingClientRect();st.style.transition=`transform ${d}ms cubic-bezier(.15,.7,.15,1)`;st.style.transform=`translateY(-${dist}px)`;
setTimeout(()=>{beep(300+i*80,.08);cur[i]=arr.slice(-3);if(++done==3)fin(res,bet)},d+40)})}
function fin(res,bet){const r=ev(res),w=Math.round(r.m*bet);bal+=w;today+=w;busy=0;
if(w>0){cols.forEach((c,i)=>{if(i<r.n)c.querySelectorAll('.ce')[c.querySelectorAll('.ce').length-2].classList.add('hit')});beep(880,.35);mg(`🎉 +${fm(w)}`);if(w>=bet*10){banner(w);confetti()}}else mg('আবার চেষ্টা করুন');
best=Math.max(best,w);H.unshift({b:bet,r:res.map(k=>TX[k]).join(' '),w});H=H.slice(0,40);try{localStorage.setItem('sl_h',JSON.stringify(H));localStorage.setItem('sl_w',best)}catch(e){}ui();
if(auto)setTimeout(spin,w>0?1800:700)}
let av='',nm='আপনি';function banner(w){$('#wa').innerHTML=av?`<img src="${av}">`:'👤';$('#wt').textContent=fm(w)+' coins';$('#wb').classList.add('on');setTimeout(()=>$('#wb').classList.remove('on'),3000)}
function confetti(){const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:13;pointer-events:none';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const g=c.getContext('2d'),cs=['#ffd84a','#ff5a7a','#4ac8ff','#7aff7a','#c77aff','#fff'],A=[...Array(110)].map(()=>({x:c.width/2,y:c.height*.5,vx:(Math.random()-.5)*15,vy:-Math.random()*15-4,r:Math.random()*5+3,c:cs[Math.random()*6|0],a:0,s:(Math.random()-.5)*.4}));let n=0;(function f(){g.clearRect(0,0,c.width,c.height);A.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=p.s;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.fillRect(-p.r,-p.r/2,p.r*2,p.r);g.restore()});if(++n<150)requestAnimationFrame(f);else c.remove()})();try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
let lt,lg=0;const sp=$('#sp');sp.onpointerdown=()=>{lg=0;lt=setTimeout(()=>{lg=1;auto=!auto;sp.classList.toggle('auto',!!auto);sp.firstChild.textContent=auto?'AUTO':'SPIN';if(auto)spin()},600)};
sp.onpointerup=sp.onpointerleave=()=>{clearTimeout(lt)};sp.onclick=()=>{if(lg)return;if(auto){auto=0;sp.classList.remove('auto');sp.firstChild.textContent='SPIN';return}spin()};
$('#mi').onclick=()=>{bi=Math.max(0,bi-1);ui();beep(500,.05)};$('#pb').onclick=()=>{bi=Math.min(BETS.length-1,bi+1);ui();beep(600,.05)};$('#fast').onclick=()=>{fast=!fast;$('#fast').classList.toggle('on',!!fast)};
$('#mn').onclick=()=>{const m=$('#menu');m.style.display=m.style.display=='block'?'none':'block'};
$('#mMu').onclick=()=>{mus=!mus;$('#mMu .tg').classList.toggle('on',!!mus)};$('#mSn').onclick=()=>{snd=!snd;$('#mSn .tg').classList.toggle('on',!!snd)};
