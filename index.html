async function sig(d){if(!d||d.to!=sid||!RR)return;if(!PC[d.from])mk(d.from);const x=PC[d.from];if(!x)return;const pc=x.pc;try{if(d.d){await pc.setRemoteDescription(d.d);x.q.splice(0).forEach(c=>pc.addIceCandidate(c).catch(()=>{}));if(d.d.type=='offer'){await pc.setLocalDescription(await pc.createAnswer());RR.emit('sig',{to:d.from,from:sid,d:pc.localDescription})}}else if(d.c){pc.remoteDescription?await pc.addIceCandidate(d.c):x.q.push(d.c)}}catch(e){}}

function send(i){const g=S.gifts[i];if(S.u.coin<g[2])return toast('কয়েন কম! রিচার্জ করুন');S.u.coin-=g[2];S.u.xp+=g[2];const r=cur();if(!io_&&r)r.chat.push(`🎁 ${S.u.n} পাঠালেন ${g[0]} ${g[1]}`);if(io_)io_.emit('gift',{g:g[0]+' '+g[1]});sheet();fly(g[0]);toast(g[1]+' গিফট গেছে!');render()}
async function mic(){const r=cur();if(!r||!r.seats.some(x=>x&&x.me))return toast('আগে সিটে বসুন');if(!LK)return toast('ভয়েস সার্ভার সংযুক্ত হলে মাইক চালু হবে');
const n=S.mic?0:1;try{await LK.localParticipant.setMicrophoneEnabled(!n);S.mic=n;if(io_)io_.emit('mute',n);toast(n?'🔇 মাইক বন্ধ':'🎤 মাইক চালু')}catch(e){toast('মাইক permission দিন, তারপর আবার চাপুন')}render()}
if(io_)io_.on('kicked',()=>{leaveVoice();S.room=null;toast('রুমের মালিক আপনাকে বের করেছেন');render()});
if(io_)io_.on('blocked',()=>{leaveVoice();S.room=null;toast('এই রুমে আপনাকে ব্লক করা হয়েছে');render()});
render();
</script></body></html>
