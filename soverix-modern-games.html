<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আধুনিক গেমস • Soverix Net</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 25% 15%,#2d6bd6,#143578 55%,#091a48)}
body{display:flex;justify-content:center;align-items:center}
#wrap{display:flex;flex-direction:column;gap:8px;align-items:center}
.row{display:flex;justify-content:space-between;width:100%}
.card{display:flex;align-items:center;gap:4px;padding:3px 6px;border:2px solid #f3c622;border-radius:12px;background:linear-gradient(90deg,#0b46b8,#2a7bd8);width:46%;opacity:.5;transition:.3s}
.card.r{flex-direction:row-reverse}
.card.on{opacity:1;box-shadow:0 0 14px #ffd54a;transform:scale(1.03)}
.card.off{visibility:hidden}
.nm{font-size:10px;font-weight:700;flex:1;text-align:center}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;flex:none}
.dice{width:38px;height:38px;perspective:200px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#f9dede,#d99a9a);border-radius:9px;border:2px solid #f3c622;flex:none}
.cube{width:24px;height:24px;position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.f{position:absolute;inset:0;background:#fff;border-radius:6px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:3px;border:1px solid #bbb;backface-visibility:hidden}
.f i{width:4px;height:4px;border-radius:50%;background:#222;place-self:center}
.me .card.on .dice{animation:pu .7s infinite alternate}
@keyframes pu{to{box-shadow:0 0 16px 4px #fff}}
canvas{border-radius:6px;box-shadow:0 8px 26px rgba(0,0,0,.5);touch-action:none}
#bar{display:flex;gap:10px;align-items:center;font-size:14px;min-height:32px}
#rs{background:#ffffff22;border:1px solid #fff6;color:#fff;border-radius:8px;padding:3px 10px;font-size:16px}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9;backdrop-filter:blur(4px)}
.ov[hidden]{display:none}
.bx{background:linear-gradient(#1b4fb5,#0c2f78);border:2px solid #f3c622;border-radius:18px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:12px;width:80%;max-width:320px}
.bx h1{font-size:34px}
.bx button{background:linear-gradient(#ffd54a,#f0a500);border:0;border-radius:12px;padding:12px;font-size:18px;font-weight:700;color:#3a2600}
.bx[hidden]{display:none}.sm{font-size:13px;opacity:.9}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g3 button{padding:10px 0!important;font-size:16px!important}.bx .alt{background:linear-gradient(#7be0ff,#2aa0e0);color:#04304a}
.bx input{padding:10px;font-size:20px;text-align:center;border-radius:10px;border:2px solid #f3c622;width:100%}
</style></head><body>
<div id="wrap"><div class="row" id="top"></div><canvas id="cv"></canvas><div class="row" id="bot"></div>
<div id="bar"><span id="msg"></span><button id="rs">↻</button></div></div>
<div id="menu" class="ov"><div class="bx" id="mb"><h1>🎲 আধুনিক গেমস</h1>
<p class="sm">📴 অফলাইন — কম্পিউটারের সাথে</p><div class="g3"><button data-m="ai" data-n="1">১ জন</button><button data-m="ai" data-n="2">২ জন</button><button data-m="ai" data-n="3">৩ জন</button></div>
<p class="sm">📴 অফলাইন — এক ফোনে বন্ধুদের সাথে</p><div class="g3"><button data-m="local" data-n="1">২ জন</button><button data-m="local" data-n="2">৩ জন</button><button data-m="local" data-n="3">৪ জন</button></div>
<button class="alt" id="onl">🌐 অনলাইনে খেলুন</button></div>
<div class="bx" id="olp" hidden><h1>🌐 অনলাইন</h1><div id="o1" class="bx" style="padding:0;border:0;background:none;width:100%"><button id="mkr">নতুন রুম বানান</button><input id="cd" inputmode="numeric" maxlength="4" placeholder="৪ সংখ্যার কোড"><button id="jn">কোড দিয়ে যোগ দিন</button></div>
<div id="o2" class="bx" hidden style="padding:0;border:0;background:none;width:100%"><p id="ot"></p><button id="go">শুরু করুন</button></div><p class="sm" id="oe"></p><button class="alt" id="ob">← ফিরে যান</button></div></div>
<div id="win" class="ov" hidden><div class="bx"><h1 id="wt"></h1><button id="again">আবার খেলুন</button></div></div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),ctx=cv.getContext('2d'),bg=document.createElement('canvas');
const C=['#e8202a','#0b9c48','#ffdf17','#1196e8'],L=['#ff8a8f','#6ae59a','#fff7a0','#9bdbff'],D=['#8d0b12','#05602b','#b39700','#0a5a9a'];
let NM=['কম্পিউটার ১','কম্পিউটার ২','কম্পিউটার ৩','আপনি'],M='ai',OL=null,RM=null;
const hum=pl=>M==='ai'?pl===3:1,mine=pl=>M==='ai'?pl===3:M==='local'?1:OL.seat===pl,send=d=>OL&&OL.room.emit('act',d).catch(()=>{});
function setNames(a){NM=a;cards.forEach((d,i)=>d.querySelector('.nm').textContent=NM[i]);drawBoard()}
const BASE=[[0,0],[9,0],[9,9],[0,9]],S=[0,13,26,39],H=[[1,7,1,0],[7,1,0,1],[13,7,-1,0],[7,13,0,-1]],FIN=[[6.8,7.5],[7.5,6.8],[8.2,7.5],[7.5,8.2]];
const path=[],seg=(x,y,dx,dy,n)=>{for(let i=0;i<n;i++)path.push([x+dx*i,y+dy*i])};
seg(1,6,1,0,5);seg(6,5,0,-1,6);seg(7,0,1,0,2);seg(8,1,0,1,5);seg(9,6,1,0,6);seg(14,7,0,1,2);seg(13,8,-1,0,5);seg(8,9,0,1,6);seg(7,14,-1,0,2);seg(6,13,0,-1,5);seg(5,8,-1,0,6);seg(0,7,0,-1,2);
const safe=i=>i%13===0||i%13===8,wait=ms=>new Promise(r=>setTimeout(r,ms)),msg=t=>$('#msg').textContent=t;
const yp=(pl,i)=>[BASE[pl][0]+2+(i%2)*2,BASE[pl][1]+2+(i>>1)*2];
function pos(pl,p,i){if(p<0)return yp(pl,i);if(p<=50){const[x,y]=path[(S[pl]+p)%52];return[x+.5,y+.5]}if(p<56){const[x,y,dx,dy]=H[pl],k=p-51;return[x+dx*k+.5,y+dy*k+.5]}return FIN[pl]}
const tween=(pc,tx,ty,ms)=>new Promise(res=>{const sx=pc.x,sy=pc.y,t0=performance.now();const f=t=>{const k=Math.min(1,Math.max(0,(t-t0)/ms));pc.x=sx+(tx-sx)*k;pc.y=sy+(ty-sy)*k;pc.h=k<1?Math.sin(k*Math.PI)*.3:0;k<1?requestAnimationFrame(f):res()};f(t0)});
// dice
const FT=['','translateZ(12px)','rotateY(90deg) translateZ(12px)','rotateX(90deg) translateZ(12px)','rotateX(-90deg) translateZ(12px)','rotateY(-90deg) translateZ(12px)','rotateY(180deg) translateZ(12px)'],RT=[0,[0,0],[0,-90],[-90,0],[90,0],[0,90],[0,180]];
const cube=document.createElement('div');cube.className='cube';
[[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]].forEach((pt,n)=>{const f=document.createElement('div');f.className='f';f.style.transform=FT[n+1];for(let k=0;k<9;k++)f.innerHTML+=`<i style="visibility:${pt.includes(k)?'visible':'hidden'}"></i>`;cube.append(f)});
let spin=0;
// cards
const cards=[];
function mk(pl,rev){const d=document.createElement('div');d.className='card'+(rev?' r':'');d.innerHTML=`<div class="dot" style="background:${C[pl]}"></div><div class="nm">${NM[pl]}</div><div class="dice"></div>`;cards[pl]=d;return d}
$('#top').append(mk(0,0),mk(1,1));$('#bot').append(mk(3,0),mk(2,1));
// board
let W=300,dpr=1;
function star(g,cx,cy,R){g.beginPath();for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,r=k%2?R*.45:R;g[k?'lineTo':'moveTo'](cx+Math.cos(a)*r,cy+Math.sin(a)*r)}g.closePath();g.fillStyle='#ffd54a';g.fill();g.strokeStyle='#b8860b';g.lineWidth=1;g.stroke()}
function drawBoard(){const g=bg.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);const c=W/15;g.fillStyle='#fff';g.fillRect(0,0,W,W);
for(let pl=0;pl<4;pl++){const[bx,by]=BASE[pl];g.fillStyle=C[pl];g.fillRect(bx*c,by*c,6*c,6*c);g.fillStyle='#fff';g.fillRect((bx+1)*c,(by+1)*c,4*c,4*c);
for(let i=0;i<4;i++){const[x,y]=yp(pl,i);g.fillStyle=C[pl];g.beginPath();g.arc(x*c,y*c,c*.42,0,7);g.fill();g.strokeStyle=D[pl];g.lineWidth=c*.08;g.stroke()}
g.font=`bold ${c*.5}px system-ui`;g.textAlign='center';g.textBaseline='middle';g.lineWidth=c*.1;g.strokeStyle='rgba(0,0,0,.5)';const ty=(by+(pl<2?.5:5.5))*c;g.strokeText(NM[pl],(bx+3)*c,ty);g.fillStyle='#fff';g.fillText(NM[pl],(bx+3)*c,ty)}
const cell=(x,y,col)=>{g.fillStyle=col;g.fillRect(x*c,y*c,c,c);g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=1;g.strokeRect(x*c,y*c,c,c)};
path.forEach(([x,y])=>cell(x,y,'#fff'));
for(let pl=0;pl<4;pl++){const[x,y,dx,dy]=H[pl];for(let k=0;k<5;k++)cell(x+dx*k,y+dy*k,C[pl]);const[sx,sy]=path[S[pl]];cell(sx,sy,C[pl])}
const tri=(a,b,col)=>{g.fillStyle=col;g.beginPath();g.moveTo(a[0]*c,a[1]*c);g.lineTo(b[0]*c,b[1]*c);g.lineTo(7.5*c,7.5*c);g.fill()};
tri([6,6],[6,9],C[0]);tri([6,6],[9,6],C[1]);tri([9,6],[9,9],C[2]);tri([6,9],[9,9],C[3]);
[8,21,34,47].forEach(i=>star(g,(path[i][0]+.5)*c,(path[i][1]+.5)*c,c*.38))}
function fit(){const s=Math.floor(Math.min(innerWidth-8,innerHeight-175,600));W=s;dpr=Math.min(devicePixelRatio||1,2);$('#wrap').style.width=s+'px';cv.style.width=cv.style.height=s+'px';cv.width=cv.height=bg.width=bg.height=s*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);drawBoard()}
// pins
function pin(x,y,pl,k,hl){const c=W/15*k;ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,0,c*.3,c*.1,0,0,7);ctx.fill();
if(hl){ctx.strokeStyle='#fff';ctx.lineWidth=c*.1;ctx.beginPath();ctx.ellipse(0,0,c*.4,c*.15,0,0,7);ctx.stroke()}
ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-c*.4,-c*.35,-c*.36,-c*.65);ctx.arc(0,-c*.65,c*.36,Math.PI,0);ctx.quadraticCurveTo(c*.4,-c*.35,0,0);
let g=ctx.createLinearGradient(-c*.4,0,c*.4,0);g.addColorStop(0,'#fff');g.addColorStop(.5,'#e4e7ec');g.addColorStop(1,'#9aa0aa');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#777';ctx.lineWidth=1;ctx.stroke();
g=ctx.createRadialGradient(-c*.07,-c*.72,c*.02,0,-c*.65,c*.22);g.addColorStop(0,L[pl]);g.addColorStop(.6,C[pl]);g.addColorStop(1,D[pl]);ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,-c*.65,c*.22,0,7);ctx.fill();ctx.restore()}
let G={pcs:[],phase:'idle'};
function frame(t){ctx.clearRect(0,0,W,W);ctx.drawImage(bg,0,0,W,W);const c=W/15,all=[];
G.pcs.forEach((a,pl)=>a.forEach((pc,i)=>all.push({pl,i,pc})));
const grp={};all.forEach(o=>{const k=o.pc.h?Math.random():o.pc.x.toFixed(2)+','+o.pc.y.toFixed(2);(grp[k]=grp[k]||[]).push(o)});
Object.values(grp).forEach(a=>a.forEach((o,k)=>{o.pc.dx=a.length>1?(k-(a.length-1)/2)*.24:0;o.pc.sc=a.length>1?.8:1}));
all.sort((a,b)=>a.pc.y-b.pc.y);
for(const{pl,i,pc}of all){const mv=G.phase==='pick'&&pl===G.cur&&G.mv.includes(i),b=mv?Math.abs(Math.sin(t/180))*.15:0;pin((pc.x+pc.dx)*c,(pc.y+.3-pc.h-b)*c,pl,pc.sc,mv)}
requestAnimationFrame(frame)}
// game
function newGame(n,act){if(G)G.dead=1;G={act:act||[[1,3],[0,2,3],[0,1,2,3]][n-1],pcs:[],phase:'idle',sixes:0};
for(let pl=0;pl<4;pl++)G.pcs[pl]=G.act.includes(pl)?[0,1,2,3].map(i=>{const[x,y]=yp(pl,i);return{p:-1,x,y,h:0,dx:0,sc:1}}):[];
cards.forEach((d,pl)=>d.classList.toggle('off',!G.act.includes(pl)));$('#menu').hidden=$('#win').hidden=true;G.cur=G.act[G.act.length-1];next()}
function next(){const a=G.act;G.cur=a[(a.indexOf(G.cur)+1)%a.length];G.sixes=0;turn()}
function turn(){const g=G;g.phase='roll';cards.forEach((d,i)=>d.classList.toggle('on',i===g.cur));cards[g.cur].querySelector('.dice').append(cube);const h=mine(g.cur);document.body.classList.toggle('me',h);msg(h?(M==='local'?NM[g.cur]+' — ডাইস চাপুন':'আপনার পালা — ডাইস চাপুন'):NM[g.cur]+(hum(g.cur)?' এর পালা...':' খেলছে...'));if(!hum(g.cur))setTimeout(()=>g.dead||doRoll(),800)}
async function doRoll(rr){const g=G;if(g.phase!=='roll')return;g.phase='rolling';document.body.classList.remove('me');const r=rr||1+Math.random()*6|0;if(M==='online'&&!rr)send({t:'r',r});spin++;const[rx,ry]=RT[r];cube.style.transform=`rotateX(${rx+720*spin}deg) rotateY(${ry+720*spin}deg)`;await wait(950);if(g.dead)return;g.roll=r;
if(r===6){if(++g.sixes===3){msg('তিনটি ৬ — পালা গেল');await wait(900);return g.dead||next()}}else g.sixes=0;
const mv=[];g.pcs[g.cur].forEach((p,i)=>{if(p.p<0?r===6:p.p+r<=56)mv.push(i)});
if(!mv.length){msg('কোনো চাল নেই');await wait(800);return g.dead||next()}
if(!hum(g.cur)){await wait(450);return g.dead||play(ai(r,mv))}
if(mv.length===1){await wait(250);return g.dead||play(mv[0])}
g.mv=mv;g.phase='pick';msg('একটি গুটি বেছে নিন')}
async function play(i){const g=G,pl=g.cur,pc=g.pcs[pl][i],r=g.roll;g.phase='move';let ex=r===6;
const n=pc.p<0?1:r;for(let k=0;k<n;k++){pc.p++;const[x,y]=pos(pl,pc.p,i);await tween(pc,x,y,n===1?260:130);if(g.dead)return}
if(pc.p<=50){const idx=(S[pl]+pc.p)%52;if(!safe(idx)){const ps=[];g.pcs.forEach((a,o)=>{if(o!==pl)a.forEach((q,j)=>{if(q.p>=0&&q.p<=50&&(S[o]+q.p)%52===idx){q.p=-1;ps.push(tween(q,...yp(o,j),450))}})});if(ps.length){ex=true;navigator.vibrate&&navigator.vibrate(60);msg('গুটি কাটা পড়ল! 💥');await Promise.all(ps)}}}
if(pc.p===56)ex=true;if(g.dead)return;
if(g.pcs[pl].every(q=>q.p===56)){g.phase='over';$('#wt').textContent=mine(pl)&&M!=='local'?'🎉 আপনি জিতেছেন!':'🎉 '+NM[pl]+' জিতেছে';$('#win').hidden=false;return}
ex?turn():next()}
function ai(r,mv){const pl=G.cur;
const thr=i=>G.pcs.some((a,o)=>o!==pl&&a.some(q=>{if(q.p<0||q.p>50)return 0;const d=(i-(S[o]+q.p)%52+52)%52;return d>=1&&d<=6}));
const cap=i=>G.pcs.some((a,o)=>o!==pl&&a.some(q=>q.p>=0&&q.p<=50&&(S[o]+q.p)%52===i));
let b=mv[0],bs=-1e9;for(const i of mv){const p=G.pcs[pl][i].p,np=p<0?0:p+r;let s=Math.random()*6+np*.3;if(p<0)s+=45;
if(np===56)s+=100;else if(np>50)s+=35;else{const x=(S[pl]+np)%52;if(safe(x))s+=20;else{if(cap(x))s+=90;if(thr(x))s-=30}}
if(p>=0&&p<=50){const x=(S[pl]+p)%52;if(!safe(x)&&thr(x))s+=25}if(s>bs){bs=s;b=i}}return b}
// input
cv.onpointerdown=e=>{if(G.phase!=='pick'||!mine(G.cur))return;const r=cv.getBoundingClientRect(),c=r.width/15,mx=(e.clientX-r.left)/c,my=(e.clientY-r.top)/c;let b=-1,bd=.9;
for(const i of G.mv){const p=G.pcs[G.cur][i],d=Math.hypot(mx-(p.x+p.dx),my-(p.y-.3));if(d<bd){bd=d;b=i}}if(b>=0){M==='online'&&send({t:'p',i:b});play(b)}};
document.addEventListener('click',e=>{if(e.target.closest('.dice')&&G.phase==='roll'&&mine(G.cur))doRoll()});
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{M=b.dataset.m;OL=null;setNames(M==='ai'?['কম্পিউটার ১','কম্পিউটার ২','কম্পিউটার ৩','আপনি']:['লাল','সবুজ','হলুদ','নীল']);newGame(+b.dataset.n)});
function leaveOL(){if(OL){OL.un.forEach(f=>f());try{OL.room.leave()}catch(e){}OL=null}M='ai';$('#mb').hidden=false;$('#olp').hidden=true;$('#o1').hidden=false;$('#o2').hidden=true;$('#oe').textContent=''}
$('#onl').onclick=async()=>{$('#mb').hidden=true;$('#olp').hidden=false;if(!RM){try{RM=window.claude&&await claude.use('room')}catch(e){}}if(!RM)$('#oe').textContent='অনলাইন এখানে চালু নেই — শুধু যাদের এই পেজে অ্যাক্সেস দেওয়া আছে তারা খেলতে পারবেন'};
function refresh(){const n=OL.peers.filter(p=>p.kind==='viewer').length;$('#ot').textContent=OL.host?`রুম কোড: ${OL.code} — ${n} জন যোগ দিয়েছে। বন্ধুদের কোডটা দিন`:`কোড ${OL.code} — ${n} জন আছে। হোস্টের শুরুর অপেক্ষা...`;$('#go').disabled=n<2}
function startOL(order){const sd=[3,1,0,2],me=OL.peers.find(p=>p.isMe&&p.sameTab);OL.owner={};order.forEach((p,k)=>OL.owner[sd[k]]=p);const k=order.indexOf(me&&me.peer);if(k<0){$('#oe').textContent='রুমে জায়গা নেই';return}
OL.seat=sd[k];M='online';const nm=['লাল','সবুজ','হলুদ','নীল'];order.forEach((p,j)=>nm[sd[j]]=sd[j]===OL.seat?'আপনি':'প্লেয়ার '+(j+1));setNames(nm);newGame(0,Object.keys(OL.owner).map(Number).sort())}
async function enter(code,host){const e=$('#oe');if(!RM){e.textContent='অনলাইন এখানে চালু নেই';return}e.textContent='যুক্ত হচ্ছে...';
try{const room=await RM.join('l'+code);OL={room,host,code,seat:-1,peers:[],un:[]};room.presence({h:host?1:0});
OL.un.push(room.onPeers(c=>{OL.peers=c.peers;refresh()}));
OL.un.push(room.on('act',m=>{if(m.isMe)return;const d=m.data||{},hp=OL.peers.find(p=>p.presence.h===1);
if(d.t==='go'){if(hp&&m.peer===hp.peer&&Array.isArray(d.o))startOL(d.o.slice(0,4))}
else if(d.t==='r'&&G.phase==='roll'&&OL.owner&&OL.owner[G.cur]===m.peer&&d.r>=1&&d.r<=6)doRoll(d.r|0);
else if(d.t==='p'&&G.phase==='pick'&&OL.owner&&OL.owner[G.cur]===m.peer&&G.mv.includes(d.i))play(d.i)}));
