<script>
  (function(){
    function moveDiceOutside(){
      document.querySelectorAll('div[style*="perspective"]').forEach(function(el){
        var s=getComputedStyle(el);
        if(s.width==='64px'&&s.height==='64px'){
          el.classList.add('soverix-outside-dice');
          /* React's 3D wrapper creates a containing block for fixed children.
             Remove only that wrapper transform so the die can sit in the
             viewport center without changing the original board geometry. */
          if(el.parentElement&&getComputedStyle(el.parentElement).transform!=='none')el.parentElement.style.transform='none';
        }
      });
    }
    moveDiceOutside();setInterval(moveDiceOutside,800);
  })();
